# real scheme behind Cloudflare (https) or direct (http)
map $http_x_forwarded_proto $jamir_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # behind a proxy / Cloudflare: keep redirects relative so https is preserved
    absolute_redirect off;
    root @ROOT@/site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # admin uploads (videos) stream straight to the API
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    # old URLs → SEO URLs (permanent)
    location ~ ^/product/(.+)$ { return 301 /san-pham/$1$is_args$args; }
    location ~ ^/news/(.+)$    { return 301 /tin-tuc/$1$is_args$args; }
    location = /news           { return 301 /tin-tuc$is_args$args; }
    location ~ ^/lp/(.+)$      { return 301 /uu-dai/$1$is_args$args; }
    location = /community      { return 301 /cong-dong$is_args$args; }

    # SEO pages: index.html with title / description / Open Graph / JSON-LD filled in by the API
    location ~ ^/(san-pham|tin-tuc|uu-dai|cong-dong)(/|$) {
        proxy_pass http://127.0.0.1:3001/api/seo/page?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $jamir_proto;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }
    location = / {
        proxy_pass http://127.0.0.1:3001/api/seo/page?path=/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $jamir_proto;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }
    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $jamir_proto;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $jamir_proto;
    }

    location /media/uploads/ {
        alias @ROOT@/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
